# HTTP server for i247.com
server {
  listen 80;
  listen [::]:80;

  server_name i247.com www.i247.com api.i247.com x21.i247.com;

  root /apps/www/i247/html;  # Path to the static content for this domain
  index index.html index.json;

  location /go/ {
    proxy_pass https://api.vpc:9543/;
    proxy_redirect off;

    proxy_ssl_server_name on;
    proxy_ssl_name api.i247.com;
    proxy_set_header Host api.i247.com;

    # proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering on;
    proxy_request_buffering on;

    keepalive_timeout 60s;

    client_max_body_size 10m;
    client_body_buffer_size 128k;

    proxy_connect_timeout 90;
    proxy_send_timeout 90;
    proxy_read_timeout 90;

    proxy_buffer_size 4k;
    proxy_buffers 4 32k;
    proxy_busy_buffers_size 64k;
    proxy_temp_file_write_size 64k;
  }

  location = /go/ws/connect {
    proxy_pass https://api.vpc:9543/ws/connect;
    proxy_redirect off;

    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_ssl_server_name on;
    proxy_ssl_name   api.i247.com;
    proxy_set_header Host api.i247.com;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering         off;
    proxy_request_buffering off;
    proxy_connect_timeout   30s;
    proxy_send_timeout      3600s;
    proxy_read_timeout      3600s;
  }

  # for certbot certs only run hardcoded root
  location /.well-known/acme-challenge/ {
      root /apps/www/i247/html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
} # HTTP server 

# HTTPS server for i247.com
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;

  server_name i247.com www.i247.com api.i247.com x21.i247.com;

  root /apps/www/i247/html;  # Path to the static content for this domain
  index index.html index.json;

  ssl_certificate /etc/letsencrypt/live/i247.com/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/i247.com/privkey.pem; # managed by Certbot
  include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

  proxy_ssl_server_name on;
  proxy_ssl_session_reuse on;

  location /go/ {
    proxy_pass https://api.vpc:9543/;
    proxy_redirect off;

    # The SNI and certificate verification fix
    proxy_ssl_name api.i247.com;
    proxy_set_header Host api.i247.com;

    # proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering on;
    proxy_request_buffering on;

    keepalive_timeout 60s;

    client_max_body_size 100m;
    client_body_buffer_size 128k;

    proxy_connect_timeout 90;
    proxy_send_timeout 90;
    proxy_read_timeout 90;

    proxy_buffer_size 4k;
    proxy_buffers 4 32k;
    proxy_busy_buffers_size 64k;
    proxy_temp_file_write_size 64k;
  }
  
  location = /go/ws/connect {
    proxy_pass https://api.vpc:9543/ws/connect;
    proxy_redirect off;
    
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_ssl_server_name on;
    proxy_ssl_name   api.i247.com;
    proxy_set_header Host api.i247.com;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering         off;
    proxy_request_buffering off;
    proxy_connect_timeout   30s;
    proxy_send_timeout      3600s;
    proxy_read_timeout      3600s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

} # HTTPS server