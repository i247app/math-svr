global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'math-srv'
    environment: 'development'

# Scrape configurations
scrape_configs:
  # Math-srv application metrics
  - job_name: 'math-srv'
    static_configs:
      - targets: ['host.docker.internal:9091']  # App exposes metrics on port 9091
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: '/metrics'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s

  # Jaeger metrics
  - job_name: 'jaeger'
    static_configs:
      - targets: ['jaeger:14269']
    scrape_interval: 30s
